<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | My Portfolio</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
:root {
  --bg: #0b0d11;
  --bg2: #0f1115;
  --text: #ffffff;
  --muted: #a1a1a1;
  --primary: #3b82f6;
  --secondary: #8b5cf6;
}

body.light {
  --bg: #ffffff;
  --bg2: #f4f6f8;
  --text: #111111;
  --muted: #555555;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  background: var(--bg2);
  color: var(--text);
}

img { max-width: 100%; height: auto; }

.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 60px;
  background: var(--bg);
}

.logo span {
  font-size: 22px;
  font-weight: bold;
  background: linear-gradient(45deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.menu {
  display: flex;
  gap: 25px;
}

.menu a {
  color: var(--muted);
  text-decoration: none;
  padding: 8px 18px;
  border-radius: 20px;
}

.menu a.active {
  background: linear-gradient(45deg, var(--primary), var(--secondary));
  color: #fff;
}

.nav-right {
  display: flex;
  gap: 18px;
  align-items: center;
}

.nav-right i {
  cursor: pointer;
  color: var(--muted);
  transition: 0.3s;
}

.nav-right i:hover { color: var(--primary); }

.divider { width: 1px; height: 22px; background: #333; }

.search-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(45deg, var(--primary), var(--secondary));
  display: grid;
  place-items: center;
  color: #fff;
}

.contact-hero {
  padding: 100px 60px;
  text-align: center;
  background: linear-gradient(135deg, rgba(59,130,246,0.1), rgba(139,92,246,0.05));
  border-bottom: 1px solid rgba(59,130,246,0.2);
}

.contact-hero h1 { font-size: 56px; }

.contact-hero span {
  background: linear-gradient(45deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.contact-hero p {
  max-width: 700px;
  margin: 20px auto 0;
  color: var(--muted);
}

.contact-section {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 50px;
  padding: 80px 60px;
}

.contact-info, .contact-form {
  padding: 40px;
  border-radius: 20px;
  border: 1px solid rgba(59,130,246,0.2);
  box-shadow: 0 8px 25px rgba(59,130,246,0.1);
  background: var(--bg);
}

.info-item {
  display: flex;
  gap: 15px;
  margin-bottom: 25px;
}

.info-item i {
  color: var(--primary);
  font-size: 22px;
}

.contact-form h2 {
  margin-bottom: 20px;
  background: linear-gradient(45deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.contact-form input,
.contact-form textarea {
  width: 100%;
  padding: 14px;
  margin-bottom: 15px;
  border-radius: 10px;
  border: 1px solid rgba(59,130,246,0.3);
  background: rgba(255,255,255,0.05);
  color: var(--text);
}

.contact-form textarea { height: 120px; resize: none; }

.contact-form button {
  width: 100%;
  padding: 14px;
  border-radius: 30px;
  border: none;
  background: linear-gradient(45deg, var(--primary), var(--secondary));
  color: #fff;
  cursor: pointer;
}

.map { padding: 60px; }

.map iframe {
  width: 100%;
  height: 400px;
  border-radius: 20px;
  border: 1px solid rgba(59,130,246,0.2);
}

footer {
  background: var(--bg);
  padding: 30px;
  text-align: center;
  color: var(--muted);
  margin-top: 40px;
}

@media (max-width: 1000px) {
  .contact-section { grid-template-columns: 1fr; }
  .contact-section, .map { padding: 60px 30px; }
}

@media (max-width: 768px) {
  .navbar {
    flex-direction: column;
    gap: 15px;
    padding: 15px 20px;
  }

  .menu { flex-wrap: wrap; justify-content: center; gap: 10px; }

  .nav-right { flex-wrap: wrap; justify-content: center; }

  .divider { display: none; }

  .contact-hero { padding: 70px 20px; }

  .contact-hero h1 { font-size: 36px; }
}

@media (max-width: 480px) {
  .contact-section, .map { padding: 40px 15px; }

  .contact-form, .contact-info { padding: 25px; }

  .map iframe { height: 250px; }
}
</style>
</head>

<body>

<header class="navbar">
  <div class="logo"><span>ADARSH GIRI</span></div>

  <nav class="menu">
    <a href="index.html">Home</a>
    <a href="aboutus.html">About</a>
    <a class="active">Contact</a>
    <a href="project.html">Project</a>
  </nav>

  <div class="nav-right">
    <div class="divider"></div>
    <a href="https://www.instagram.com/adarsh_pndit" target="_blank"><i class="fab fa-instagram"></i></a>
    <a href="https://github.com/AdarshGiri05" target="_blank"><i class="fab fa-github"></i></a>
    <div class="divider"></div>
    <i id="themeToggle" class="fa-regular fa-sun"></i>
    <div class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></div>
  </div>
</header>

<section class="contact-hero">
  <h1>Contact <span>Us</span></h1>
  <p>Have a question or want to work together? Fill out the form below or reach us directly.</p>
</section>

<section class="contact-section">
  <div class="contact-info">
    <div class="info-item"><i class="fa-solid fa-location-dot"></i><p>Azamgarh (UP)</p></div>
    <div class="info-item"><i class="fa-solid fa-envelope"></i><p>adarshgiriag2006@gmail.com</p></div>
    <div class="info-item"><i class="fa-solid fa-phone"></i><p>+91 7905826147</p></div>
  </div>

  <form class="contact-form" onsubmit="sendMessage(event)">
    <h2>Send a Message</h2>
    <input type="text" placeholder="Your Name" required>
    <input type="email" placeholder="Your Email" required>
    <textarea placeholder="Your Message" required></textarea>
    <button type="submit">Send Message</button>
  </form>
</section>

<section class="map">
  <iframe src="https://www.google.com/maps?q=Azamgarh&output=embed" loading="lazy"></iframe>
</section>

<footer>© 2026 Portfolio</footer>

<script>
const toggle = document.getElementById("themeToggle");
toggle.onclick = () => {
  document.body.classList.toggle("light");
  toggle.classList.toggle("fa-sun");
  toggle.classList.toggle("fa-moon");
};

function sendMessage(e) {
  e.preventDefault();
  alert("Message sent successfully!");
}
</script>

</body>
</html>
